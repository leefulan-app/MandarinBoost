rect x=%22-10%22 y=%2251%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2254%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%2257%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%2260%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2263%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%2266%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%2269%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2272%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%2275%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%2278%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2281%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%2284%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%2287%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2290%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%2293%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%2296%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/><rect x=%22-10%22 y=%2299%22 width=%22120%22 height=%223%22 fill=%22%232E9B4F%22/><rect x=%22-10%22 y=%22102%22 width=%22120%22 height=%223%22 fill=%22%23D6423C%22/><rect x=%22-10%22 y=%22105%22 width=%22120%22 height=%223%22 fill=%22%232C5FA8%22/></g></svg>">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#DCE4EA;
    --paper-soft:#EBF0F4;
    --ink:#26333D;
    --muted:#66757F;
    --rule:#BFCCD6;
    --es:#B8722C;
    --es-soft:#E9DABF;
    --pl:#8F3E3E;
    --pl-soft:#E3D0CD;
    --shadow: 0 1px 0 rgba(35,38,43,0.06);
    --radius: 14px;
    --transition: 320ms cubic-bezier(.4,0,.2,1);
  }
  body.evening{
    --paper:#38404B;
    --paper-soft:#454E5A;
    --ink:#EDF0F3;
    --muted:#AEB6BF;
    --rule:#565F6B;
    --es:#D99A54;
    --es-soft:#463C2E;
    --pl:#CC7A7A;
    --pl-soft:#463536;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    transition: background var(--transition), color var(--transition);
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 80px;}
  header{padding:6px 0 18px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  h1#app-title{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:38px;
    margin:4px 0 10px;
    letter-spacing:-0.01em;
  }
  h1#app-title .jp{font-size:0.62em;font-weight:600;color:var(--muted);margin-left:6px;}
  .date-row{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .date-text{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
  }
  .lang-badge{
    padding:2px 10px;
    border-radius:20px;
    background:var(--paper-soft);
    border:1.5px solid var(--rule);
  }
  .lang-badge.es{color:var(--es);border-color:var(--es);}
  .lang-badge.zh{color:var(--es);border-color:var(--es);}
  .lang-badge.pl{color:var(--pl);border-color:var(--pl);}

  .auth-box{
    background:var(--paper-soft);
    border:1.5px solid var(--rule);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .auth-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .auth-row input{
    flex:1;min-width:140px;
    background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;color:var(--ink);
    padding:8px 10px;
    outline:none;
  }
  .auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sync-status{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap;}
  .sync-status.ok{color:#3E8E5A;}
  .sync-status.err{color:var(--pl);}
  .signed-in-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .tts-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .tts-row select{
    background:var(--paper-soft);border:1.5px solid var(--rule);border-radius:8px;
    padding:6px 8px;font-size:12.5px;color:var(--ink);font-family:'IBM Plex Mono',monospace;
  }
  .spk-btn{
    display:inline-flex;align-items:center;gap:3px;
    background:none;border:1px solid var(--rule);border-radius:20px;
    padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink);
    margin-left:6px;vertical-align:middle;
  }

  .lang-picker{display:flex;gap:8px;margin:14px 0 6px;}
  .lang-btn{
    flex:1;
    border:1.5px solid var(--rule);
    background:var(--paper-soft);
    color:var(--ink);
    padding:10px 8px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition: all var(--transition);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .lang-btn[data-lang="es"].active{border-color:var(--es);background:var(--es-soft);}
  .lang-btn[data-lang="pl"].active{border-color:var(--pl);background:var(--pl-soft);}
  .lang-btn .dot.es{background:var(--es);}
  .lang-btn .dot.pl{background:var(--pl);}

  .tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--rule);margin-bottom:18px;overflow-x:auto;}
  .tab{
    padding:9px 12px;
    font-size:13.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2.5px solid transparent;
    white-space:nowrap;
    transition: all var(--transition);
  }
  .tab.active{color:var(--ink);border-bottom-color: var(--current-accent, var(--ink));}

  .panel{display:none;}
  .panel.active{display:block; animation: fadeIn 240ms ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  input[type=date], input[type=url], textarea{
    width:100%;
    background:var(--paper-soft);
    border:1.5px solid var(--rule);
    border-radius:10px;
    padding:10px 12px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    resize:vertical;
  }
  textarea{min-height:110px; line-height:1.6;}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--ink);color:var(--paper);
    border:none;border-radius:10px;
    padding:11px 18px;
    font-weight:600;font-size:14px;
    cursor:pointer;
    margin-top:16px;
    transition: transform 150ms ease, opacity 150ms ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule);}
  .btn.small{padding:7px 12px;font-size:12.5px;margin-top:0;}

  .empty{
    border:1.5px dashed var(--rule);
    border-radius:var(--radius);
    padding:28px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* Ticket stub - signature element for review queue */
  .ticket{
    position:relative;
    display:flex;
    background:var(--paper-soft);
    border:1.5px solid var(--rule);
    border-radius:12px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .ticket-main{flex:1;padding:14px 16px;}
  .ticket-stub{
    width:64px;
    flex-shrink:0;
    border-left:2px dashed var(--rule);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    gap:2px;
  }
  .ticket-stub::before,.ticket-stub::after{
    content:'';
    position:absolute;
    width:16px;height:16px;
    background:var(--paper);
    border-radius:50%;
    left:-9px;
  }
  .ticket-stub::before{top:-8px;}
  .ticket-stub::after{bottom:-8px;}
  .ticket-date{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .ticket-gap{font-size:11px;color:var(--muted);margin-top:2px;}
  .ticket-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .ticket-lang-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    padding:2px 7px;
    border-radius:20px;
    font-weight:600;
  }
  .ticket-lang-tag.es{background:var(--es-soft);color:var(--es);}
  .ticket-lang-tag.pl{background:var(--pl-soft);color:var(--pl);}
  .ticket-body{display:none;margin-top:12px;border-top:1px solid var(--rule);padding-top:12px;}
  .ticket.open .ticket-body{display:block;}
  .ticket-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

  .toggle-row{display:flex;gap:8px;margin-bottom:10px;}
  .toggle-btn{
    flex:1;
    border:1.5px solid var(--rule);
    background:transparent;
    color:var(--muted);
    padding:7px 6px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .toggle-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .sentence-row{
    padding:10px 0;
    border-bottom:1px solid var(--rule);
  }
  .sentence-row:last-child{border-bottom:none;}
  .fx{font-size:14.5px;line-height:1.55;}
  .zh{font-size:14px;line-height:1.55;color:var(--muted);margin-top:3px;}
  .reveal-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color: var(--current-accent, var(--muted));
    background:none;border:none;cursor:pointer;
    padding:4px 0;text-decoration:underline;
  }
  .row-actions{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .mic-result{margin-top:6px;font-size:13.5px;line-height:1.6;display:none;}
  .mic-result .said{color:var(--muted);font-size:12.5px;}
  .mic-result .diffline{margin-top:3px;font-size:14.5px;}
  .mic-result .miss{color:var(--pl);text-decoration:underline;text-decoration-color:var(--pl);}
  .mic-result .score{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

  audio{width:100%;margin-top:10px;}
  .stat-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  .mini-link{
    margin-left:8px;font-size:11px;font-weight:600;background:none;border:none;
    color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;
    text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;
  }

  .hanzi-char{cursor:pointer;border-bottom:1.5px dotted var(--muted);border-radius:2px;}
  .pinyin-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;font-weight:600;color:var(--muted);
    margin-top:4px;letter-spacing:0.02em;
  }
  body.hide-pinyin .pinyin-line{display:none;}
  .pinyin-toggle-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .batch-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;margin-top:6px;
    font-size:13px;
  }
  .batch-row.overwrite{border-color:var(--pl);}
  .batch-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .batch-tag.overwrite{color:var(--pl);}
  .hanzi-char:hover{background:var(--paper-soft);}
  .stroke-modal{
    display:none;position:fixed;inset:0;background:rgba(20,22,26,0.55);
    align-items:center;justify-content:center;z-index:999;padding:20px;
  }
  .stroke-card{
    background:var(--paper);border-radius:16px;padding:20px;max-width:300px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,0.35);
  }
  .stroke-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .stroke-char-label{font-family:'Fraunces',serif;font-size:30px;font-weight:700;}
  .stroke-canvas-wrap{display:flex;justify-content:center;margin:8px 0 14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="app-title">MandarinBoost</h1>
    <div class="date-row">
      <span id="today-title" class="date-text">—</span>
      <span id="today-lang-badge" class="date-text lang-badge">—</span>
    </div>

    <div class="auth-box" id="login-box">
      <div class="auth-row">
        <input id="auth-email" type="email" placeholder="Email" autocomplete="username">
        <input id="auth-password" type="password" placeholder="密碼" data-i18n-ph="phPassword" autocomplete="current-password">
      </div>
      <div class="auth-actions">
        <button class="btn small" onclick="doSignIn()" data-i18n="loginBtn">登入</button>
        <span class="sync-status" id="sync-status" data-i18n="notSignedIn">未登入</span>
      </div>
    </div>
    <div class="auth-box" id="signed-in-box" style="display:none;">
      <div class="signed-in-bar">
        <span class="sync-status" id="signed-in-status">已登入</span>
        <button class="btn small ghost" onclick="doSignOut()" data-i18n="logoutBtn">登出</button>
      </div>
    </div>

    <div class="pinyin-toggle-row">
      <button class="btn small ghost" id="pinyin-toggle-btn" onclick="togglePinyinDisplay()">👁️ 隱藏拼音</button>
      <button class="btn small ghost" id="lang-toggle-btn" onclick="setUILang(uiLang==='zh'?'en':'zh')">EN</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-panel="upload" onclick="showTab('upload')" data-i18n="tabUpload">新增內容</div>
    <div class="tab" data-panel="morning" onclick="showTab('morning')" data-i18n="tabMorning">早上・盲聽</div>
    <div class="tab" data-panel="evening" onclick="showTab('evening')" data-i18n="tabEvening">晚上・練習</div>
    <div class="tab" data-panel="review" onclick="showTab('review')" data-i18n="tabReview">複習</div>
  </div>

  <!-- UPLOAD -->
  <div class="panel active" id="panel-upload">
    <label data-i18n="labelDate">日期</label>
    <input type="date" id="in-date" onchange="onDateChange()">

    <div class="hint" id="edit-hint" style="display:none;"></div>

    <label data-i18n="labelHanzi">漢字內容</label> <button type="button" class="mini-link" id="btn-translate-toNotes" onclick="autoTranslate('toNotes', this)" data-i18n="btnAutoTranslate">→ 自動翻成英文筆記</button>
    <textarea id="in-foreign" placeholder="今天天氣很好。&#10;我們去公園散步吧。" data-i18n-ph="phHanzi"></textarea>

    <label data-i18n="labelPinyin">拼音</label> <button type="button" class="mini-link" id="btn-gen-pinyin" onclick="generatePinyinDraft()" data-i18n="btnGenPinyin">→ 產生拼音</button>
    <textarea id="in-pinyin" placeholder="按上面「產生拼音」自動帶出來，或自己輸入" data-i18n-ph="phPinyin"></textarea>
    <div class="hint" id="pinyin-msg"></div>

    <label data-i18n="labelNotes">筆記／翻譯</label>
    <textarea id="in-zh" placeholder="The weather is very nice today.&#10;Let's go for a walk in the park." data-i18n-ph="phNotes"></textarea>

    <label data-i18n="labelAudio">音檔連結</label>
    <input type="url" id="in-audio" placeholder="https://example.com/audio/0830.mp3">

    <button class="btn" onclick="saveEntry()" data-i18n="btnSave">儲存</button>
    <div class="hint" id="upload-msg"></div>

    <div style="margin-top:28px; border-top:1.5px solid var(--rule); padding-top:16px;">
      <label data-i18n="labelBatch">批次匯入</label>
      <div class="hint">
        <span data-i18n-html="batchHint">表格欄位：<b>日期、漢字、拼音（可留空自動產生）、筆記</b>。同一天有好幾句，就用同一個日期重複列出好幾列。</span>
        <button type="button" class="mini-link" onclick="downloadBatchTemplate()" data-i18n="btnDownloadTemplate">下載範本檔</button>
      </div>
      <input type="file" id="batch-file" accept=".csv,.xlsx,.xls" style="margin-top:8px;">
      <button class="btn ghost small" style="margin-top:8px;" onclick="parseBatchFile()" data-i18n="btnParseBatch">解析檔案</button>
      <div class="hint" id="batch-msg"></div>
      <div id="batch-preview"></div>
    </div>
  </div>

  <!-- MORNING -->
  <div class="panel" id="panel-morning">
    <div id="morning-content"></div>
  </div>

  <!-- EVENING -->
  <div class="panel" id="panel-evening">
    <div id="evening-content"></div>
  </div>

  <!-- REVIEW -->

// ===== AI 朗讀（瀏覽器內建 Web Speech API，免費、不需連 Firebase 以外的任何服務）=====
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ populateVoiceSelect(todayLang); };
}
function langTag(lang){ return 'zh-TW'; }
function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang.toLowerCase().startsWith('zh')) || null;
}
function populateVoiceSelect(lang){
  const sel = document.getElementById('tts-voice');
  if(!sel || !('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('zh'));
  sel._voices = voices;
  sel.dataset.lang = 'zh';
  sel.innerHTML = voices.length
    ? voices.map((v,i)=>`<option value="${i}">${escapeHtml(v.name)}${v.localService?'':t('onlineVoice')}</option>`).join('')
    : `<option value="">${t('noVoiceFound')}</option>`;
}
function currentVoice(lang){
  const sel = document.getElementById('tts-voice');
  if(sel && sel.dataset.lang===lang && sel._voices && sel._voices.length){
    const idx = parseInt(sel.value,10);
    if(!isNaN(idx) && sel._voices[idx]) return sel._voices[idx];
  }
  return pickVoice(lang);
}
function currentRate(){
  const el = document.getElementById('tts-rate');
  return el ? parseFloat(el.value) : 0.9;
}
function speakOne(text, lang){
  if(!('speechSynthesis' in window)){ alert(t('ttsUnsupported')); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langTag(lang);
  const v = currentVoice(lang);
  if(v) u.voice = v;
  u.rate = currentRate();
  speechSynthesis.speak(u);
}
function speakSentences(sentences, lang){
  if(!('speechSynthesis' in window)){ alert(t('ttsUnsupported')); return; }
  speechSynthesis.cancel();
  const v = currentVoice(lang);
  sentences.forEach(s=>{
    const u = new SpeechSynthesisUtterance(s);
    u.lang = langTag(lang);
    if(v) u.voice = v;
    u.rate = currentRate();
    speechSynthesis.speak(u);
  });
}
function speakEntry(date, lang){
  const e = entries.find(x=>x.date===date && x.language===lang);
  if(!e) return;
  const nonEmpty = e.foreign.filter(s=>s && s.trim());
  if(nonEmpty.length===0){ alert(t('noHanziToRead')); return; }
  speakSentences(nonEmpty, lang);
}
function speakSentenceText(btn){
  speakOne(btn.dataset.text, btn.dataset.lang);
}
function stopSpeaking(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== 口說錄音比對（瀏覽器內建語音辨識，Chrome/Edge 支援較好，iOS Safari 不支援）=====
function stripPunct(s){ return s.replace(/[.,!?¡¿;:"'()\-，。！？、「」『』；：（）"“”]/g,''); }
function tokenize(text){
  // 中文沒有空白分詞，改成逐字比對
  return Array.from(stripPunct(text)).filter(ch=>ch.trim());
}
function diffAgainstTarget(targetText, saidText){
  const aDisplay = tokenize(targetText);
  const aLower = aDisplay.map(w=>w.toLowerCase());
  const bLower = tokenize(saidText).map(w=>w.toLowerCase());
  const m = aLower.length, n = bLower.length;
  // 逐字往前找配對（誰先出現就先配對），比原本用平手時容易誤判的 DP 演算法更直觀、更不會誤傷開頭的字
  const matched = new Array(m).fill(false);
  let bPos = 0;
  for(let i=0; i<m; i++){
    let found = -1;
    for(let k=bPos; k<n; k++){
      if(bLower[k]===aLower[i]){ found = k; break; }
    }
    if(found !== -1){ matched[i] = true; bPos = found + 1; }
  }
  const lcs = matched.filter(Boolean).length;
  const score = (m+n)===0 ? 100 : Math.round(200*lcs/(m+n));
  return {aDisplay, matched, score};
}
function startRecognition(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert(t('micUnsupported')); return; }
  const target = btn.dataset.target;
  const lang = btn.dataset.lang;
  const row = btn.closest('.sentence-row');
  const resultEl = row ? row.querySelector('.mic-result') : null;
  const rec = new SR();
  rec.lang = langTag(lang);
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  const origText = btn.textContent;
  btn.textContent = t('recordingEllipsis');
  btn.disabled = true;
  rec.onresult = (e)=>{
    const said = e.results[0][0].transcript;
    const {aDisplay, matched, score} = diffAgainstTarget(target, said);
    const html = aDisplay.map((w,i)=> matched[i] ? `<span>${escapeHtml(w)}</span>` : `<span class="miss">${escapeHtml(w)}</span>`).join('');
    if(resultEl){
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<div class="said">${t('saidLabel')}${escapeHtml(said)}</div><div class="diffline">${t('compareLabel')}${html}</div><div class="score">${t('scoreLabel', {score})}</div>`;
    }
  };
  rec.onerror = (e)=>{
    if(resultEl){
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<div class="score" style="color:var(--pl);">${t('recognizeFail', {err: e.error})}</div>`;
    }
  };
  rec.onend = ()=>{ btn.textContent = origText; btn.disabled = false; };
  try{ rec.start(); }catch(err){ btn.textContent = origText; btn.disabled = false; }
}

  if(!db || !currentUser){ entries = []; setSyncStatus(db ? t('pleaseSignIn') : t('notConnected'), 'err'); return; }
  try{
    setSignedInStatus(t('loadingEllipsis'));
    const doc = await db.collection('journals').doc(currentUser.uid).get();
    entries = doc.exists && doc.data().payload ? JSON.parse(doc.data().payload) : [];
    setSignedInStatus(t('signedInSynced', {email: currentUser.email}), 'ok');
  }catch(e){
    console.error('firestore load error', e);
    entries = [];
    setSignedInStatus(t('loadFailed'), 'err');
  }
}
async function persistEntries(){
  if(!db || !currentUser){ setSyncStatus(t('notSignedInNotSaved'), 'err'); return; }
  try{
    setSignedInStatus(t('savingEllipsis'));
    await db.collection('journals').doc(currentUser.uid).set({payload: JSON.stringify(entries), updatedAt: Date.now()});
    setSignedInStatus(t('signedInSynced', {email: currentUser.email}), 'ok');
  }catch(e){
    console.error('firestore save error', e);
    setSignedInStatus(t('saveFailed'), 'err');
  }
}

function entriesFor(lang){
  return entries.filter(e=>e.language===lang).sort((a,b)=>a.date.localeCompare(b.date));
}
function sessionIndexOf(lang, date){
  const list = entriesFor(lang);
  const i = list.findIndex(e=>e.date===date);
  return i===-1 ? null : i+1;
}
function todaysSessionNumber(lang){
  const list = entriesFor(lang);
  const hasToday = list.some(e=>e.date===todayStr);
  return hasToday ? sessionIndexOf(lang, todayStr) : list.length+1;
}
function dueEntries(lang){
  const todaySess = todaysSessionNumber(lang);
  return entriesFor(lang)
    .filter(e=>!e.mastered && e.date!==todayStr)
    .map(e=>({entry:e, gap: todaySess - sessionIndexOf(lang,e.date)}))
    .filter(x=>TIERS.includes(x.gap));
}

function computeArr(text){
  return text.trim() ? text.trim().split('\n').map(s=>s.trim()).filter(Boolean) : [];
}

// ===== 拼音產生（用 pinyin-pro 真正查字典，不是 AI 猜；多音字用分詞盡量抓對，但仍可能猜錯，務必自行檢查）=====
function pinyinArrayForLine(line){
  try{
    const arr = pinyinPro.pinyin(line, { type: 'array', toneType: 'symbol' });
    const chars = Array.from(line);
    if(Array.isArray(arr) && arr.length === chars.length) return arr;
    return chars.map((_,i)=> (arr && arr[i]) || '');
  }catch(e){
    console.error('pinyin error', e);
    return null;
  }
}
function generatePinyinDraft(){
  const foreignLines = computeArr(document.getElementById('in-foreign').value);
  const msg = document.getElementById('pinyin-msg');
  if(foreignLines.length===0){ msg.textContent = t('needHanziForPinyin'); return; }
  if(typeof pinyinPro === 'undefined'){ msg.textContent = t('pinyinLibFail'); return; }
  const out = foreignLines.map(line=>{
    const arr = pinyinArrayForLine(line);
    return arr ? arr.join(' ') : '';
  });
  document.getElementById('in-pinyin').value = out.join('\n');
  msg.textContent = t('pinyinGenerated');
}

let batchGroups = null; // 暫存解析結果，等使用者按「確認匯入」才真的寫入

function excelDateToStr(v){
  if(v instanceof Date) return getLocalDateStr(v);
  const s = String(v).trim();
  // 嘗試辨識常見日期格式，統一成 YYYY-MM-DD
  const m = s.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return s;
}

function parseBatchFile(){
  const fileInput = document.getElementById('batch-file');
  const msg = document.getElementById('batch-msg');
  const preview = document.getElementById('batch-preview');
  preview.innerHTML = '';
  batchGroups = null;
  if(!fileInput.files || fileInput.files.length===0){ msg.textContent = t('selectFileFirst'); return; }
  const file = fileInput.files[0];
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if(rows.length===0){ msg.textContent = t('noDataRows'); return; }

      const groups = {}; // date -> {foreign:[],pinyin:[],zh:[]}
      let skipped = 0;
      rows.forEach(row=>{
        const dateRaw = row['日期'] ?? row['date'] ?? row['Date'];
        const hanzi = String(row['漢字'] ?? row['hanzi'] ?? '').trim();
        const pinyinRaw = String(row['拼音'] ?? row['pinyin'] ?? '').trim();
        const notes = String(row['筆記'] ?? row['notes'] ?? '').trim();
        if(!dateRaw || (!hanzi && !notes)){ skipped++; return; }
        const dateStr = excelDateToStr(dateRaw);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)){ skipped++; return; }
        if(!groups[dateStr]) groups[dateStr] = { foreign: [], pinyin: [], zh: [] };
        let py = null;
        if(pinyinRaw){
          py = pinyinRaw.split(/\s+/).filter(Boolean);
        }else if(hanzi){
          py = pinyinArrayForLine(hanzi);
        }
        groups[dateStr].foreign.push(hanzi);
        groups[dateStr].zh.push(notes);
        groups[dateStr].pinyin.push(py || []);
      });

      const dates = Object.keys(groups).sort();
      if(dates.length===0){ msg.textContent = t('noValidRows', {n: skipped}); return; }

      batchGroups = groups;
      msg.textContent = t('parseComplete', {days: dates.length, skipped});
      preview.innerHTML = dates.map(d=>{
        const existing = entries.some(e=>e.date===d && e.language===todayLang);
        return `<div class="batch-row ${existing?'overwrite':''}">
          <span>${d}　${t('sentCount', {n: groups[d].foreign.length})}</span>
          <span class="batch-tag ${existing?'overwrite':''}">${existing?t('willOverwrite'):t('newDate')}</span>
        </div>`;
      }).join('') + `<button class="btn" style="margin-top:10px;" onclick="confirmBatchImport()">${t('btnConfirmImport')}</button>`;
    }catch(err){
      console.error('batch parse error', err);
      msg.textContent = t('fileReadFail');
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmBatchImport(){
  const msg = document.getElementById('batch-msg');
  if(!batchGroups){ msg.textContent = t('parseFirst'); return; }
  const dates = Object.keys(batchGroups);
  dates.forEach(d=>{
    const g = batchGroups[d];
    entries = entries.filter(e=>!(e.date===d && e.language===todayLang));
    entries.push({ date: d, language: todayLang, foreign: g.foreign, zh: g.zh, pinyin: g.pinyin, audioUrl: '', mastered: false });
  });
  msg.textContent = t('savingEllipsis');
  await persistEntries();
  msg.textContent = t('importComplete', {days: dates.length});
  document.getElementById('batch-preview').innerHTML = '';
  batchGroups = null;
  document.getElementById('batch-file').value = '';
  loadForEdit();
  renderAll();
}

// ===== 自動翻譯（免費、免申請金鑰的 MyMemory API；品質普通，翻完務必自行檢查/編輯）=====
async function translateOneLine(text, langpair){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
  const res = await fetch(url);
  const data = await res.json();
  return (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : '';
}
async function autoTranslate(direction, btn){
  const foreignEl = document.getElementById('in-foreign');
  const zhEl = document.getElementById('in-zh');
  const msg = document.getElementById('upload-msg');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = t('translatingEllipsis');
  try{
    const lines = computeArr(foreignEl.value);
    if(lines.length===0){ msg.textContent = t('hanziFieldEmpty'); return; }
    const out = [];
    for(const line of lines){ out.push(await translateOneLine(line, 'zh-TW|en')); }
    zhEl.value = out.join('\n');
    msg.textContent = t('translatedToEn');
  }catch(e){
    console.error('translate error', e);
    msg.textContent = t('translateFailed');
  }finally{
    btn.disabled = false;
    btn.textContent = origText;
  }
}

function loadForEdit(){
  const date = selectedDate;
  const entry = entries.find(e=>e.date===date && e.language===todayLang);
  const hint = document.getElementById('edit-hint');
  if(entry){
    document.getElementById('in-foreign').value = entry.foreign.join('\n');
    document.getElementById('in-zh').value = entry.zh.join('\n');
    document.getElementById('in-pinyin').value = (entry.pinyin || []).map(arr => Array.isArray(arr) ? arr.join(' ') : (arr||'')).join('\n');
    document.getElementById('in-audio').value = entry.audioUrl || '';
    hint.style.display = 'block';
    hint.textContent = t('loadedForEdit', {date, lang: t('langChinese')});
  }else{
    document.getElementById('in-foreign').value = '';
    document.getElementById('in-zh').value = '';
    document.getElementById('in-pinyin').value = '';
    document.getElementById('in-audio').value = '';
    hint.style.display = 'none';
  }
}

async function saveEntry(){
  const date = selectedDate;
  const fxRaw = document.getElementById('in-foreign').value;
  const zhRaw = document.getElementById('in-zh').value;
  const pyRaw = document.getElementById('in-pinyin').value;
  const audio = document.getElementById('in-audio').value.trim();
  const msg = document.getElementById('upload-msg');
  const fxArr = computeArr(fxRaw);
  const zhArr = computeArr(zhRaw);
  const pyLines = pyRaw.split('\n');
  if(fxArr.length===0 && zhArr.length===0){
    msg.textContent = t('needOneField');
    return;
  }
  const len = Math.max(fxArr.length, zhArr.length);
  const fx = Array.from({length: len}, (_, i) => fxArr[i] || '');
  const zh = Array.from({length: len}, (_, i) => zhArr[i] || '');
  // 拼音：每行用空白分出每個字的音，跟該行漢字字數比對，對不上就不強行套用（顯示時會自動退回不標拼音）
  const pinyinField = Array.from({length: len}, (_, i) => {
    const line = (pyLines[i] || '').trim();
    if(!line) return null;
    const syll = line.split(/\s+/).filter(Boolean);
    return syll;
  });
  entries = entries.filter(e=>!(e.date===date && e.language===todayLang));
  entries.push({date, language: todayLang, foreign: fx, zh: zh, pinyin: pinyinField, audioUrl: audio, mastered:false});
  await persistEntries();
  const note = fxArr.length !== zhArr.length ? t('lineMismatchNote') : '';
  msg.textContent = t('savedEntry', {date, lang: t('langChinese'), n: len, note});
  loadForEdit();
  renderAll();
}

// ===== 筆順彈窗（用開源 Hanzi Writer 套件，動畫在原本畫面上顯示，不跳轉網站）=====
let strokeWriterInstance = null;
function showStrokeOrder(char){
  const modal = document.getElementById('stroke-modal');
  const target = document.getElementById('stroke-target');
  document.getElementById('stroke-modal-char').textContent = char;
  target.innerHTML = '';
  modal.style.display = 'flex';
  try{
    strokeWriterInstance = HanziWriter.create(target, char, {
      width: 220,
      height: 220,
      padding: 10,
      showOutline: true,
      strokeAnimationSpeed: 1,
      delayBetweenStrokes: 300,
      strokeColor: '#22303A'
    });
    strokeWriterInstance.animateCharacter();
  }catch(e){
    console.error('hanzi writer error', e);
    target.innerHTML = `<div class="hint">${t('strokeNotFound')}</div>`;
  }
}
function replayStroke(){
  if(strokeWriterInstance) strokeWriterInstance.animateCharacter();
}
function closeStrokeModal(){
  document.getElementById('stroke-modal').style.display = 'none';
}

function wrapHanzi(text){
  return Array.from(text).map(ch=>{
    if(/[\u4e00-\u9fff]/.test(ch)){
      return `<span class="hanzi-char" onclick="showStrokeOrder('${ch}')">${ch}</span>`;
    }
    return escapeHtml(ch);
  }).join('');
}

function pinyinLineHtml(pinyinArr){
  if(!Array.isArray(pinyinArr) || pinyinArr.length===0) return '';
  return `<div class="pinyin-line">${escapeHtml(pinyinArr.join(' '))}</div>`;
}

function sentenceBlock(entry, opts){
  const {compareMode=true} = opts||{};
  return entry.foreign.map((f,i)=>{
    const zh = entry.zh[i];
    const py = (entry.pinyin || [])[i];
    const fDisplay = f || t('noHanziYet');
    const zhDisplay = zh || t('noNotesYet');
    const revealId = `rv_${entry.date}_${entry.language}_${i}`.replace(/[^a-zA-Z0-9_]/g,'');
    const spkBtn = f ? `<button class="spk-btn" data-text="${escapeAttr(f)}" data-lang="${entry.language}" onclick="speakSentenceText(this)">🔊</button>` : '';
    const pyLine = f ? pinyinLineHtml(py) : '';
    if(compareMode){
      return `<div class="sentence-row"><div class="fx">${wrapHanzi(fDisplay)}${spkBtn}</div>${pyLine}<div class="zh">${escapeHtml(zhDisplay)}</div></div>`;
    }
    const micBtn = f ? `<button class="spk-btn" data-target="${escapeAttr(f)}" data-lang="${entry.language}" onclick="startRecognition(this)">${t('micCompare')}</button>` : '';
    return `<div class="sentence-row">
      <div class="zh">${escapeHtml(zhDisplay)}</div>
      <div class="row-actions">
        <button class="reveal-btn" onclick="document.getElementById('${revealId}').style.display='block'; this.style.display='none';">${t('showHanzi')}</button>
        ${micBtn}
      </div>
      <div id="${revealId}" style="display:none">
        <div class="fx">${wrapHanzi(fDisplay)}${spkBtn}</div>
        ${pyLine}
      </div>
      <div class="mic-result"></div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

        <option value="0.9" selected>${t('rateNormal')}</option>

function renderEvening(){
  const el = document.getElementById('evening-content');

    el.innerHTML = `<div class="empty">${t('noContentPractice', {date: selectedDate, lang: t('langChinese')})}</div>`;

let doneToday = new Set();
try{ doneToday = new Set(JSON.parse(localStorage.getItem('doneToday_'+todayStr) || '[]')); }catch(e){}
function markDoneToday(date, lang){
  doneToday.add(date+'|'+lang);
  try{ localStorage.setItem('doneToday_'+todayStr, JSON.stringify([...doneToday])); }catch(e){}
  renderReview();
}

function renderReview(){
  const stat = document.getElementById('review-stat');
  const list = document.getElementById('review-list');
  const reviewLang = langForDate(todayStr);
  const due = dueEntries(reviewLang)
    .filter(x=>!doneToday.has(x.entry.date+'|'+x.entry.language))
    .sort((a,b)=>a.entry.date.localeCompare(b.entry.date));
  stat.textContent = t('reviewStat', {n: todaysSessionNumber(reviewLang), lang: t('langChinese'), due: due.length});
  if(due.length===0){
    list.innerHTML = `<div class="empty">${t('reviewEmpty')}</div>`;
    return;
  }
  list.innerHTML = due.map(({entry,gap})=>{
    return `
    <div class="ticket" id="ticket-${entry.date}-${entry.language}">
      <div class="ticket-main">
        <div class="ticket-top">
          <span class="ticket-lang-tag es">${t('langChinese')}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);">${entry.date} · ${t('gapLabel', {gap})}</span>
        </div>
        <div class="toggle-row">
          <button class="toggle-btn active" onclick="setTicketMode('${entry.date}','${entry.language}',true,this)">${t('toggleCompare')}</button>
          <button class="toggle-btn" onclick="setTicketMode('${entry.date}','${entry.language}',false,this)">${t('toggleNotesOnly')}</button>
        </div>
        <button class="btn small ghost" onclick="toggleTicket('${entry.date}','${entry.language}')">${t('expandCollapse')}</button>
        <div class="ticket-body" data-mode="compare">
          ${sentenceBlock(entry,{compareMode:true})}
        </div>
        <div class="ticket-actions">
          <button class="btn small ghost" onclick="speakEntry('${entry.date}','${entry.language}')">${t('aiRead')}</button>
          <button class="btn small ghost" onclick="markDoneToday('${entry.date}','${entry.language}')">${t('doneToday')}</button>
          <button class="btn small ghost" onclick="markMastered('${entry.date}','${entry.language}')">${t('masterForever')}</button>
        </div>
      </div>
      <div class="ticket-stub">
        <div class="ticket-date">${fmtDate(entry.date)}</div>
        <div class="ticket-gap">gap ${gap}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleTicket(date, lang){
  document.getElementById(`ticket-${date}-${lang}`).classList.toggle('open');
}
function setTicketMode(date, lang, compare, btn){
  const ticket = document.getElementById(`ticket-${date}-${lang}`);
  ticket.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const entry = entries.find(e=>e.date===date && e.language===lang);
  const body = ticket.querySelector('.ticket-body');
  body.innerHTML = sentenceBlock(entry, {compareMode: compare});
  ticket.classList.add('open');
}
async function markMastered(date, lang){
  const e = entries.find(e=>e.date===date && e.language===lang);
  if(e){ e.mastered = true; await persistEntries(); renderReview(); }
}
